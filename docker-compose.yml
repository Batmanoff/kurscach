# Один сервис приложения + Postgres. Next.js не нужен.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fashion
      POSTGRES_PASSWORD: fashion
      POSTGRES_DB: fashion_store
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fashion -d fashion_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./fashion-store/backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://fashion:fashion@db:5432/fashion_store
      REDIS_URL: ""
      BACKEND_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:5000
      YOOKASSA_RETURN_URL: http://localhost:5000/checkout/success
      CORS_ORIGINS: http://localhost:5000
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed.py && gunicorn -b 0.0.0.0:5000 -w 2 run:app"

volumes:
  pgdata:
