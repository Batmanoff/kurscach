{% extends "base.html" %}
{% block title %}Вход — {{ store_name }}{% endblock %}
{% block content %}
<div class="mx-auto flex max-w-6xl justify-center px-5 py-20 md:px-8">
  <form method="post" class="w-full max-w-md space-y-5 border-2 border-ink/10 bg-white/70 p-8">
    <h1 class="font-display text-5xl">Вход</h1>
    <p class="text-sm text-muted">Войдите, чтобы оформить заказ и сохранить избранное.</p>
    <div>
      <label class="label">Email</label>
      <input class="input" type="email" name="email" value="{{ email or '' }}" required />
    </div>
    <div>
      <label class="label">Пароль</label>
      <input class="input" type="password" name="password" required />
    </div>
    <button class="btn w-full" type="submit">Войти</button>
    <p class="text-sm text-muted">Нет аккаунта? <a class="underline hover:text-ink" href="{{ url_for('web.register') }}">Регистрация</a></p>
  </form>
</div>
{% endblock %}
