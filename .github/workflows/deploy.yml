name: Backend check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashion-store/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install & smoke
        env:
          SECRET_KEY: ci-secret
          JWT_SECRET_KEY: ci-jwt
          DATABASE_URL: sqlite:///ci.db
          FRONTEND_URL: http://127.0.0.1:5000
          BACKEND_URL: http://127.0.0.1:5000
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python seed.py
          python -c "from app import create_app; c=create_app().test_client(); r=c.get('/'); assert r.status_code==200; h=c.get('/api/health'); assert h.json['status']=='ok'"
